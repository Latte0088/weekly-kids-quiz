<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>だい1かい クイズ | 小学2年生の家庭学習教材</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body>
    <div class="wrap">

      <main id="view-quiz">
        <div class="quiz-top">
          <button class="back-btn" id="backHome" type="button">← もくじへ もどる</button>
          <div class="progress-box">
            <span class="qcount" id="qCount"></span>
            <span class="stars" id="progressStars" aria-label="あつめた ほし"></span>
          </div>
        </div>

        <section class="question-card" id="questionCard">
          <span class="cat-chip" id="catChip"></span>
          <div class="q-illust" id="qIllust" aria-hidden="true"></div>
          <p class="q-text" id="qText"></p>
          <p class="q-sub" id="qSub"></p>
          <div class="choices" id="choices"></div>

          <div class="feedback try" id="feedbackTry" hidden>
            <p class="big">おしい！😮</p>
            <p id="hintText"></p>
          </div>

          <div id="correctArea" hidden>
            <div class="feedback good">
              <p class="big" id="praiseText">ピンポーン！すごい！🎉</p>
              <p>やったね！<ruby>正解<rt>せいかい</rt></ruby>だよ。</p>
            </div>
            <div class="fact-box">
              <p class="fact-head">💡 へぇ〜！まめちしき</p>
              <p id="factText"></p>
            </div>
            <button class="next-btn" id="nextBtn" type="button"></button>
          </div>
        </section>
      </main>

      <main id="view-result" hidden>
        <section class="result-card" id="resultCard">
          <div class="medal-wrap">
            <svg width="150" height="170" viewBox="0 0 150 170" role="img" aria-label="メダルの イラスト">
              <path d="M52 0 L75 52 L62 60 L38 8 Z" fill="#ff6b4a"/>
              <path d="M98 0 L75 52 L88 60 L112 8 Z" fill="#3d9bff"/>
              <circle id="medalCircle" cx="75" cy="105" r="52" fill="#f5a623"/>
              <circle cx="75" cy="105" r="42" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="5 7" opacity="0.85"/>
              <path d="M75 76 L84 96 L105 97 L89 110 L94 131 L75 119 L56 131 L61 110 L45 97 L66 96 Z" fill="#ffffff"/>
            </svg>
          </div>
          <h2>クイズ クリア！🎉</h2>
          <div class="result-stars" id="resultStars"></div>
          <p class="result-msg" id="medalName"></p>
          <p class="result-msg" id="resultMsg"></p>
          <div class="result-btns">
            <button class="again-btn" id="againBtn" type="button">🔁 もういちど あそぶ</button>
            <button class="home-btn" id="resultHomeBtn" type="button">📚 もくじへ もどる</button>
          </div>
        </section>
      </main>
    </div>

    <script>
      var QUIZ_DATA = [
        {
          cat: "🛒 おかいもの さんすう",
          catClass: "c1",
          illust: "🍬",
          q: "おかしを かいに いきました。100えんの おかねで、30えんの ガムを 1つ かいました。おつりは いくらでしょう？",
          sub: "おつりは「わたした おかね − かかった おかね」だよ。",
          choices: [
            { t: "30えん", ok: false },
            { t: "70えん", ok: true },
            { t: "130えん", ok: false },
            { t: "おつりは ない", ok: false }
          ],
          hint: "もういちど かんがえて みよう。ヒント：100 から 30を ひいて みよう。のこりは いくら かな？",
          fact: "おつりは、なるべく すくない まいかずの コインで もどって くるよ。70えん なら、50えん コイン 1まいと 10えん コイン 2まい。おさいふが かるく なる くふうだね！"
        },
        {
          cat: "🎮 ゲーム さんすう",
          catClass: "c2",
          illust: "⭐",
          q: "ゲームで あそんで います。ほしを 3つ あつめると 10ポイント もらえます。では、ほしを 6つ あつめたら、なんポイントでしょう？",
          sub: "「3つで 10ポイント」の セットが いくつ あるか かんがえて みよう。",
          choices: [
            { t: "13ポイント", ok: false },
            { t: "16ポイント", ok: false },
            { t: "20ポイント", ok: true },
            { t: "60ポイント", ok: false }
          ],
          hint: "もういちど かんがえて みよう。ヒント：6つは、3つの なんばい かな？セットの かずを かぞえて みよう。",
          fact: "ほし 3つ = 10ポイントが 1セット。6つは 2セットだから、10 + 10 = 20ポイント。「おなじ かずの セットが いくつ あるか」を かんがえると はやく わかるよ。これが かけざんの ひらめきだね！"
        },
        {
          cat: "🌳 かんじ クイズ",
          catClass: "c3",
          illust: "🌲",
          q: "「<ruby>木<rt>き</rt></ruby>」という かんじが 3つ あつまると、なんという かんじに なるでしょう？",
          sub: "<ruby>木<rt>き</rt></ruby> ＋ <ruby>木<rt>き</rt></ruby> ＋ <ruby>木<rt>き</rt></ruby> ＝ ？",
          choices: [
            { t: "<ruby>森<rt>もり</rt></ruby>", ok: true },
            { t: "<ruby>林<rt>はやし</rt></ruby>", ok: false },
            { t: "<ruby>山<rt>やま</rt></ruby>", ok: false },
            { t: "<ruby>川<rt>かわ</rt></ruby>", ok: false }
          ],
          hint: "もういちど かんがえて みよう。ヒント：<ruby>木<rt>き</rt></ruby>が 2つだと「はやし」。3つだと もっと おおきく なるよ。",
          fact: "かんじは、<ruby>絵<rt>え</rt></ruby>から できた もじだよ。<ruby>木<rt>き</rt></ruby>が 2つで <ruby>林<rt>はやし</rt></ruby>、3つで <ruby>森<rt>もり</rt></ruby>。<ruby>木<rt>き</rt></ruby>が たくさん あつまると、おおきな <ruby>森<rt>もり</rt></ruby>に なる イメージだね！"
        },
        {
          cat: "🐌 いきもの ざつがく",
          catClass: "c4",
          illust: "🐌",
          q: "カタツムリの <ruby>歯<rt>は</rt></ruby>は、なん<ruby>本<rt>ぼん</rt></ruby> くらい あるでしょう？",
          sub: "にんげんの <ruby>歯<rt>は</rt></ruby>は 28〜32<ruby>本<rt>ぼん</rt></ruby> くらいだよ。",
          choices: [
            { t: "0<ruby>本<rt>ぼん</rt></ruby>", ok: false },

            { t: "1まん<ruby>本<rt>ぼん</rt></ruby> いじょう", ok: true }
          ],
          hint: "もういちど かんがえて みよう。ヒント：カタツムリの <ruby>歯<rt>は</rt></ruby>は、にんげんより ずーっと おおいよ。びっくりする くらい おおいよ！",
          fact: "カタツムリの くちには「しぜつ」という、やすりの ような したが あって、ちいさな <ruby>歯<rt>は</rt></ruby>が 1まん<ruby>本<rt>ぼん</rt></ruby> いじょう ならんで いるんだって！はっぱを けずって たべるよ。ちいさいのに すごいね！"
        },
        {
          cat: "🛁 なぞなぞ",
          catClass: "c5",
          illust: "🛁",
          q: "なぞなぞです。うえは おおみず、したは おおかじ。さて、なん でしょう？",
          sub: "おとなも いっしょに かんがえて みてね。",
          choices: [
            { t: "おふろ", ok: true },
            { t: "プール", ok: false },
            { t: "おなべ", ok: false },
            { t: "かみなり", ok: false }
          ],
          hint: "もういちど かんがえて みよう。ヒント：まいにち はいる、あたたかい あれだよ。うえには おゆ、したには…？",
          fact: "むかしの おふろは、したで <ruby>木<rt>き</rt></ruby>を もやして おゆを わかして いたんだ。だから「うえは みず、したは ひ」。いまは ガスや でんきで わかす ことが おおいね！"
        }
      ];
    </script>
    <script src="../assets/quiz.js?v=3"></script>
  </body>
</html>
