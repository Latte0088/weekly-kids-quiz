<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3さいの あそび | こどもの あそびば</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: none; background: #fff7e6; color: #4a3728;
  }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none !important; }

  /* ---------- 共通 ---------- */
  .home-btn {
    position: absolute; top: 10px; left: 10px; z-index: 50;
    min-width: 76px; min-height: 64px; padding: 6px 14px;
    border: none; border-radius: 999px; background: #ffffff;
    box-shadow: 0 4px 0 #e8dcc8, 0 6px 14px rgba(0,0,0,.12);
    font-size: 1.7rem; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    font-family: inherit; color: #4a3728;
  }
  .home-btn .hb-t { font-size: .95rem; font-weight: 700; }
  .home-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e8dcc8; }
  .big-btn {
    min-height: 72px; border: none; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-weight: 800; color: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.18);
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
  .big-btn:disabled { opacity: .35; box-shadow: none; }

  /* ---------- ハブ ---------- */
  #view-hub { background: linear-gradient(180deg, #fff3d6 0%, #ffe3ee 55%, #d9f4ff 100%); padding: 84px 16px 20px; align-items: center; overflow-y: auto; touch-action: pan-y; }
  #view-hub h1 { font-size: clamp(1.5rem, 5.5vw, 2.3rem); margin-bottom: 4px; }
  #view-hub .sub { font-size: 1rem; color: #8a6d4f; margin-bottom: 20px; font-weight: 700; }
  .hub-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 880px; }
  .hub-card {
    flex: 1 1 220px; max-width: 270px; min-height: 218px;
    background: #fff; border: 5px solid #fff; border-radius: 30px; cursor: pointer;
    box-shadow: 0 8px 0 rgba(180,140,90,.25), 0 14px 28px rgba(0,0,0,.10);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 16px 10px; font-family: inherit;
  }
  .hub-card:active { transform: scale(.96); }
  .hub-card svg { width: 118px; height: 96px; }
  .hub-card .hc-name { font-size: 1.35rem; font-weight: 800; }
  .hub-card.c1 { background: #fff8ee; } .hub-card.c2 { background: #f0fbf0; } .hub-card.c3 { background: #eef2ff; }

  /* ---------- おべんとう ---------- */
  #view-bento { background: linear-gradient(180deg, #fff8ee, #ffedd5); padding: 84px 14px 14px; align-items: center; }
  .bento-box {
    width: min(92vw, 430px); background: #c2452d; border-radius: 26px; padding: 12px;
    box-shadow: 0 10px 0 #93321f, 0 18px 30px rgba(0,0,0,.18);
  }
  .bento-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bento-cell {
    background: #fffdf6; border-radius: 16px; aspect-ratio: 1.12; border: 3px dashed #e8d9bd;
    display: flex; align-items: center; justify-content: center; font-size: clamp(2.4rem, 11vw, 3.4rem);
    cursor: pointer; position: relative;
  }
  .bento-cell.filled { border-style: solid; border-color: #ffd9a0; animation: pop-in .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop-in { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  .food-tray { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; max-width: 520px; }
  .food-btn {
    width: 76px; height: 76px; border-radius: 24px; border: 4px solid #ffe1ae; background: #fff;
    font-size: 2.5rem; cursor: pointer; box-shadow: 0 5px 0 #ecd9b8;
    display: flex; align-items: center; justify-content: center;
  }
  .food-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ecd9b8; }
  .food-btn.used { opacity: .22; pointer-events: none; }
  .bento-actions { margin-top: auto; width: 100%; max-width: 520px; display: flex; justify-content: flex-end; padding-top: 14px; }
  #doneBtn { background: #ff7b54; font-size: 1.5rem; padding: 10px 34px; }
  .celebrate {
    position: absolute; inset: 0; background: rgba(255,248,238,.93); z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .celebrate[hidden] { display: none !important; }
  .mogu-face { font-size: 7.2rem; animation: chew .38s ease-in-out infinite alternate; line-height: 1.1; }
  @keyframes chew { from { transform: scale(1,1); } to { transform: scale(1.07,.9); } }
  .mogu-text { font-size: 2rem; font-weight: 800; color: #e2603f; }
  .celebrate .big-btn { background: #4db6ff; font-size: 1.3rem; padding: 8px 30px; margin-top: 8px; }
  .confetti { position: absolute; top: -20px; width: 11px; height: 15px; border-radius: 3px; z-index: 61; pointer-events: none; animation: conf-fall linear forwards; }
  @keyframes conf-fall { to { transform: translateY(108dvh) rotate(680deg); } }

  /* ---------- どうぶつ かくれんぼ ---------- */
  #view-animal { background: linear-gradient(180deg, #d8f7d8, #f4ffe9); padding: 84px 14px 14px; align-items: center; }
  .scene { position: relative; width: min(94vw, 460px); height: min(46dvh, 320px); margin-top: 4px; }
  .peek { position: absolute; left: 50%; bottom: 34%; transform: translateX(-50%); width: 46%; z-index: 1; }
  .peek svg { width: 100%; height: auto; display: block; }
  .bush-wrap { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; z-index: 2; display: flex; }
  .bush-half { flex: 1; transition: transform .55s cubic-bezier(.34,1.3,.64,1); }
  .bush-half svg { width: 100%; height: 100%; display: block; }
  .scene.open .bush-l { transform: translateX(-72%) rotate(-5deg); }
  .scene.open .bush-r { transform: translateX(72%) rotate(5deg); }
  .scene.rustle .bush-wrap { animation: rustle .45s ease-in-out; }
  @keyframes rustle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(1.6deg); } 75% { transform: rotate(-1.6deg); } }
  .reveal-animal { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); width: 62%; z-index: 3; }
  .reveal-animal svg { width: 100%; height: auto; display: block; }
  .reveal-animal.jump { animation: jump .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes jump { 0% { transform: translateX(-50%) translateY(26%) scale(.6); opacity: 0; } 60% { opacity: 1; } 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } }
  .animal-q { font-size: 1.5rem; font-weight: 800; margin: 10px 0 4px; }
  .choices { display: flex; gap: 12px; justify-content: center; margin-top: auto; padding-top: 10px; width: 100%; max-width: 560px; }
  .choice-card {
    flex: 1; max-width: 168px; min-height: 132px; background: #fff; border: 5px solid #cdeecd; border-radius: 26px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: 0 6px 0 rgba(120,170,120,.35); font-family: inherit; padding: 8px 4px;
  }
  .choice-card svg { width: 76px; height: 76px; }
  .choice-card .ch-name { font-size: 1.05rem; font-weight: 800; color: #3c6e3c; }
  .choice-card.shake { animation: shake .4s ease-in-out; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px) rotate(-2deg); } 75% { transform: translateX(7px) rotate(2deg); } }
  #nextBtn { background: #66bb6a; font-size: 1.35rem; padding: 8px 32px; margin-top: 12px; }
  .star-fx { position: absolute; font-size: 2rem; z-index: 40; pointer-events: none; animation: star-fly .8s ease-out forwards; }
  @keyframes star-fly { to { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(120deg); opacity: 0; } }
  .progress-dots { display: flex; gap: 6px; justify-content: center; margin: 0 0 8px; flex-wrap: wrap; }
  .pdot { width: 20px; height: 20px; border-radius: 50%; background: #e4eee4; border: 3px solid #b9d2b9; }
  .pdot.now { border-color: #ff9800; animation: pdot-pulse .7s ease-in-out infinite alternate; }
  @keyframes pdot-pulse { from { transform: scale(1); } to { transform: scale(1.22); } }
  .pdot.done { background: #a5d6a7; border-color: #81c784; }
  .pdot.perfect { background: #ffb300; border-color: #ff8f00; }
  .stars-row { font-size: 1.9rem; letter-spacing: 2px; line-height: 1.3; text-align: center; max-width: 92vw; }
  .animal-result .big-btn { background: #66bb6a; }
  .drag-ghost { position: fixed; z-index: 99; font-size: 3.6rem; transform: translate(-50%, -55%); pointer-events: none; filter: drop-shadow(0 8px 8px rgba(0,0,0,.3)); }
  .bento-cell.hover { outline: 5px solid #ffb74d; outline-offset: -5px; background: #fff0d0; }

  /* ---------- おべんとう追加分 ---------- */
  .food-btn svg, .bento-cell svg, .drag-ghost svg { width: 72%; height: 72%; }
  .drag-ghost svg { width: 54px; height: 54px; }
  .cell-food { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .cell-food.fx-bounce { animation: food-bounce .55s cubic-bezier(.34,1.56,.64,1); }
  @keyframes food-bounce { 0% { transform: scale(.4,1.5); } 35% { transform: scale(1.25,.72); } 60% { transform: scale(.9,1.12); } 100% { transform: scale(1,1); } }
  .cell-food.gulp { animation: gulp .3s ease-in forwards; }
  @keyframes gulp { to { transform: scale(.1) rotate(24deg); opacity: 0; } }
  .steam { position: absolute; bottom: 58%; width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.9); filter: blur(2.5px); pointer-events: none; animation: steam-up 1.05s ease-out forwards; }
  @keyframes steam-up { to { transform: translateY(-46px) scale(2.1); opacity: 0; } }
  .plate-row { width: min(92vw, 430px); display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .plate-btn { min-height: 64px; padding: 6px 18px; border: 4px solid #ffd9a0; background: #fff; border-radius: 999px; font-family: inherit; font-size: 1.05rem; font-weight: 800; color: #7a5a34; cursor: pointer; box-shadow: 0 4px 0 #ecd9b8; }
  .plate-btn:active { transform: translateY(3px); box-shadow: none; }
  .bento-wrap { position: relative; width: min(92vw, 430px); }
  .bento-wrap .bento-box { width: 100%; }
  .plate-badge { position: absolute; top: -30px; left: -6px; font-size: 2.9rem; z-index: 3; transform: rotate(-8deg); filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
  .bento-box.train { background: linear-gradient(180deg, #d8efff 0 25%, #ffffff 25% 41%, #5ea9dd 41% 100%); border-radius: 110px 26px 26px 110px; box-shadow: 0 10px 0 #3d7ca8, 0 18px 30px rgba(0,0,0,.18); }
  .bento-box.train .bento-cell { border-color: #bcd9ef; }
  .eat-banner { display: flex; align-items: center; gap: 12px; margin-top: 16px; background: rgba(255,255,255,.75); padding: 6px 20px 6px 10px; border-radius: 999px; }
  .eat-banner[hidden] { display: none !important; }
  .eat-face { font-size: 3.6rem; line-height: 1; }
  .eat-face.chewing { animation: chew .3s ease-in-out infinite alternate; }
  .eat-text { font-size: 1.15rem; font-weight: 800; color: #b05a2a; }
  .food-tray.disabled, .bento-actions.disabled { opacity: .35; pointer-events: none; }
  .hanamaru { font-size: 7.2rem; line-height: 1.1; animation: hanamaru-in .7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes hanamaru-in { 0% { transform: scale(.2) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }

  /* ---------- かくれんぼ追加分 ---------- */
  .mode-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .mode-btn { min-height: 64px; padding: 6px 20px; border-radius: 999px; border: 4px solid #cdeecd; background: #fff; font-family: inherit; font-size: 1.15rem; font-weight: 800; color: #3c6e3c; cursor: pointer; }
  .mode-btn.sel { background: #66bb6a; color: #fff; border-color: #66bb6a; }
  #modeVehicleBtn.sel { background: #5c8ad6; border-color: #5c8ad6; }
  .pstar { font-size: 1.55rem; color: #ccd8cc; line-height: 1; }
  .pstar.filled { color: #ffb300; animation: star-pop .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes star-pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  .pstar.now { color: #ff9800; animation: pdot-pulse .7s ease-in-out infinite alternate; display: inline-block; }
  .scene.rustle-big .bush-wrap { animation: rustle-big .5s ease-in-out; }
  @keyframes rustle-big { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(2.6deg) scale(1.03); } 75% { transform: rotate(-2.6deg) scale(1.03); } }
  .leaf-fx { position: absolute; z-index: 5; pointer-events: none; font-size: 1.5rem; animation: leaf-fly .85s ease-out forwards; }
  @keyframes leaf-fly { to { transform: translate(var(--dx), var(--dy)) rotate(200deg); opacity: 0; } }
  #view-animal.veh-mode { background: linear-gradient(180deg, #dbe9f7, #f2f7ff); }
  #animalFx { position: absolute; inset: 0; z-index: 70; pointer-events: none; }

  /* ---------- はなび おえかき ---------- */
  #view-draw { background: #0b1035; }
  .draw-stage { position: relative; flex: 1; }
  .draw-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fxCanvas { z-index: 2; touch-action: none; }
  #artCanvas { z-index: 1; }
  .draw-bar {
    background: rgba(16,20,54,.92); padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; z-index: 5;
  }
  .color-btn { width: 64px; height: 64px; border-radius: 50%; border: 5px solid transparent; cursor: pointer; flex: none; padding: 0; }
  .color-btn.sel { border-color: #fff; transform: scale(1.12); }
  .stamp-btn {
    width: 64px; height: 64px; border-radius: 20px; border: 4px solid #3a4176; background: #1c2250;
    color: #ffe082; font-size: 1.8rem; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center; font-family: inherit;
  }
  .stamp-btn.sel { border-color: #fff; background: #2c357a; }
  .stamp-toggle { width: auto; min-width: 78px; padding: 0 14px; }
  .stamp-pop { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(14,17,48,.97); border-radius: 26px 26px 0 0; padding: 18px 14px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.5); }
  .stamp-pop[hidden] { display: none !important; }
  .stamp-pop-title { text-align: center; color: #dbe4ff; font-weight: 800; font-size: 1.15rem; margin-bottom: 14px; }
  .stamp-pop-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .stamp-pop-grid .stamp-btn { width: 72px; height: 72px; font-size: 2.1rem; }
  .stamp-pop-close { display: block; margin: 16px auto 0; min-height: 64px; padding: 6px 30px; border-radius: 999px; border: 4px solid #3a4176; background: #1c2250; color: #fff; font-family: inherit; font-size: 1.15rem; font-weight: 800; cursor: pointer; }
  #trashBtn { color: #cfd8dc; }
  #launchBtn { background: linear-gradient(180deg, #ff8a50, #ff5252); font-size: 1.4rem; padding: 8px 26px; }
  .draw-home { background: rgba(255,255,255,.92); }
</style>
</head>
<body>

  <!-- ハブ -->
  <section class="view" id="view-hub">
    <button type="button" class="home-btn" id="siteTopBtn" aria-label="サイトのトップへ">⬅️<span class="hb-t">トップ</span></button>
    <h1>🎈 3さいの あそび</h1>
    <p class="sub">すきな あそびを タップしてね</p>
    <div class="hub-cards">
      <button type="button" class="hub-card c1" data-goto="bento">
        <svg viewBox="0 0 120 96" aria-hidden="true"><rect x="8" y="26" width="104" height="58" rx="14" fill="#c2452d"/><rect x="16" y="34" width="88" height="42" rx="9" fill="#fff7e8"/><line x1="45" y1="34" x2="45" y2="76" stroke="#e5cfa5" stroke-width="4"/><line x1="76" y1="34" x2="76" y2="76" stroke="#e5cfa5" stroke-width="4"/><text x="30" y="68" font-size="24" text-anchor="middle">🍙</text><text x="60" y="68" font-size="24" text-anchor="middle">🥚</text><text x="90" y="68" font-size="24" text-anchor="middle">🍅</text></svg>
        <span class="hc-name">🍱 おべんとうづくり</span>
      </button>
      <button type="button" class="hub-card c2" data-goto="animal">
        <svg viewBox="0 0 120 96" aria-hidden="true"><circle cx="46" cy="34" r="10" fill="#fff"/><circle cx="46" cy="34" r="5" fill="#333"/><circle cx="76" cy="34" r="10" fill="#fff"/><circle cx="76" cy="34" r="5" fill="#333"/><circle cx="22" cy="66" r="24" fill="#57a657"/><circle cx="50" cy="56" r="28" fill="#66bb6a"/><circle cx="82" cy="58" r="26" fill="#57a657"/><circle cx="102" cy="70" r="20" fill="#4c9a4c"/></svg>
        <span class="hc-name">🦁 どうぶつ かくれんぼ</span>
      </button>
      <button type="button" class="hub-card c3" data-goto="draw">
        <svg viewBox="0 0 120 96" aria-hidden="true"><rect x="4" y="4" width="112" height="88" rx="14" fill="#141a4d"/><circle cx="88" cy="20" r="2.4" fill="#fff"/><circle cx="20" cy="16" r="2" fill="#fff"/><circle cx="38" cy="30" r="1.8" fill="#fff"/><g stroke="#ffd54f" stroke-width="3" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="34"/><line x1="60" y1="66" x2="60" y2="50"/><line x1="36" y1="42" x2="52" y2="42"/><line x1="68" y1="42" x2="84" y2="42"/><line x1="43" y1="25" x2="54" y2="36"/><line x1="66" y1="48" x2="77" y2="59"/><line x1="77" y1="25" x2="66" y2="36"/><line x1="54" y1="48" x2="43" y2="59"/></g><circle cx="60" cy="42" r="5" fill="#ff8a80"/><circle cx="94" cy="66" r="3.4" fill="#82b1ff"/><circle cx="26" cy="72" r="3" fill="#ea80fc"/></svg>
        <span class="hc-name">🎆 キラキラ はなび</span>
      </button>
    </div>
  </section>

  <!-- おべんとう -->
  <section class="view" id="view-bento" hidden>
    <button type="button" class="home-btn" data-home>🏠<span class="hb-t">もどる</span></button>
    <div class="plate-row"><button type="button" class="plate-btn" id="plateBtn">🚅 プレートに する</button></div>
    <div class="bento-wrap">
      <div class="plate-badge" id="plateBadge" hidden>🚅</div>
      <div class="bento-box" id="bentoBox"><div class="bento-grid" id="bentoGrid"></div></div>
    </div>
    <div class="eat-banner" id="eatBanner" hidden><span class="eat-face" id="eatFace">😋</span><span class="eat-text">タップして たべさせてね</span></div>
    <div class="food-tray" id="foodTray"></div>
    <div class="bento-actions"><button type="button" class="big-btn" id="doneBtn" disabled>✨ できた！</button></div>
    <div class="celebrate" id="celebrate" hidden>
      <div class="mogu-face">😋</div>
      <div class="mogu-text">モグモグ… おいしい！</div>
      <button type="button" class="big-btn" id="againBtn">🔄 もういっかい</button>
    </div>
  </section>

  <!-- どうぶつ かくれんぼ -->
  <section class="view" id="view-animal" hidden>
    <button type="button" class="home-btn" data-home>🏠<span class="hb-t">もどる</span></button>
    <div class="mode-row">
      <button type="button" class="mode-btn sel" id="modeAnimalBtn">🦁 どうぶつ</button>
      <button type="button" class="mode-btn" id="modeVehicleBtn">🚓 のりもの</button>
    </div>
    <div class="progress-dots" id="progressDots"></div>
    <div class="scene" id="scene">
      <div class="peek" id="peek"></div>
      <div class="bush-wrap" id="bushWrap">
        <div class="bush-half bush-l"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><circle cx="18" cy="72" r="30" fill="#57a657"/><circle cx="48" cy="52" r="34" fill="#66bb6a"/><circle cx="82" cy="66" r="30" fill="#57a657"/><circle cx="55" cy="84" r="30" fill="#4c9a4c"/></svg></div>
        <div class="bush-half bush-r"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><circle cx="20" cy="66" r="30" fill="#57a657"/><circle cx="52" cy="50" r="34" fill="#66bb6a"/><circle cx="84" cy="72" r="30" fill="#57a657"/><circle cx="48" cy="86" r="30" fill="#4c9a4c"/></svg></div>
      </div>
      <div class="reveal-animal" id="revealAnimal" hidden></div>
    </div>
    <p class="animal-q">だ〜れだ？</p>
    <div class="choices" id="choices"></div>
    <button type="button" class="big-btn" id="nextBtn" hidden>つぎへ ▶</button>
    <div class="celebrate animal-result" id="animalResult" hidden>
      <div class="mogu-face">🎉</div>
      <div class="stars-row" id="starsRow"></div>
      <div class="mogu-text" id="resultText"></div>
      <button type="button" class="big-btn" id="animalAgainBtn">🔄 もういっかい</button>
    </div>
    <canvas id="animalFx"></canvas>
  </section>

}

var justDragged = false;
function cellIndexFromPoint(x, y) {

  if (!cell) return -1;
  return Array.prototype.indexOf.call(bentoGrid.children, cell);
}
function clearCellHover() {
  Array.prototype.forEach.call(bentoGrid.children, function (c) { c.classList.remove("hover"); });
}
function startDrag(e, src) {
  if (bentoLock) return;
  var startX = e.clientX, startY = e.clientY, moved = false, ghost = null;
  var emoji = src.type === "tray" ? FOODS[src.fi].html : FOODS[bentoCells[src.ci]].html;
  function onMove(ev) {
    var dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!moved && Math.sqrt(dx * dx + dy * dy) < 11) return;
    if (!moved) {
      moved = true;
      justDragged = true;
      ghost = document.createElement("div");
      ghost.className = "drag-ghost";
      ghost.innerHTML = emoji;
      document.body.appendChild(ghost);
    }
    ghost.style.left = ev.clientX + "px";
    ghost.style.top = ev.clientY + "px";
    var ci = cellIndexFromPoint(ev.clientX, ev.clientY);
    clearCellHover();
    if (ci >= 0) bentoGrid.children[ci].classList.add("hover");
    ev.preventDefault();
  }
  function onUp(ev) {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    if (!moved) return;
    if (ghost) ghost.remove();
    clearCellHover();
    var ci = cellIndexFromPoint(ev.clientX, ev.clientY);
    if (ci >= 0) {
      ensureAudio();
      if (src.type === "tray") {
        var target = bentoCells[ci] === null ? ci : bentoCells.indexOf(null);
        if (target !== -1 && bentoCells.indexOf(src.fi) === -1) {
          bentoCells[target] = src.fi; placedCount++; refreshBento(); placementFx(target, src.fi);
        }

        var tmp = bentoCells[ci];
        bentoCells[ci] = bentoCells[src.ci];
        bentoCells[src.ci] = tmp;
        refreshBento(); sndPop();
      }
    }
    setTimeout(function () { justDragged = false; }, 80);
  }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

function refreshDots() {
  dotsEl.innerHTML = "";
  for (var i = 0; i < SET_LEN; i++) {
    var d = document.createElement("span");
    d.className = "pstar";
    if (dotStates[i]) { d.classList.add("filled"); d.textContent = "⭐"; }
    else {
      d.textContent = "☆";
      if (i === setQ - 1 && !animalLock) d.classList.add("now");
    }
    dotsEl.appendChild(d);
  }
}
function startAnimalSet() {
  setQ = 0; setScore = 0; dotStates = [];
  animalResultEl.hidden = true;
  newAnimalRound();
}
function showAnimalResult() {
  nextBtn.hidden = true;
  document.getElementById("starsRow").textContent = "⭐".repeat(setScore) + "☆".repeat(SET_LEN - setScore);
  var praise = setScore >= 8 ? "すごい！" : (setScore >= 5 ? "がんばったね！" : "たのしかったね！");
  document.getElementById("resultText").textContent = praise + " " + setScore + "もん ピッタリ！";
  animalResultEl.hidden = false;
  ensureAudio(); sndFanfare();
  confettiBurst(animalResultEl);
  startAnimalFireworks(setScore);
}
document.getElementById("animalAgainBtn").addEventListener("click", function () { sndTap(); stopAnimalFireworks(); startAnimalSet(); });

function shuffleArr(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function newAnimalRound() {
  clearTimeout(animalTimer);
  animalLock = false;
  setQ++;
  qMissed = false;
  refreshDots();
  sceneEl.classList.remove("open");
  revealEl.hidden = true;
  revealEl.classList.remove("jump");
  nextBtn.hidden = true;
  var pool = poolList().filter(function (a) { return a.id !== lastAnimalId; });
  curAnimal = pool[Math.floor(Math.random() * pool.length)];
  lastAnimalId = curAnimal.id;
  peekEl.innerHTML = curAnimal.peek;
  peekEl.style.opacity = "1";
  var others = shuffleArr(poolList().filter(function (a) { return a.id !== curAnimal.id; })).slice(0, 2);
  var opts = shuffleArr([curAnimal].concat(others));
  choicesEl.innerHTML = "";
  opts.forEach(function (a) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "choice-card";
    b.innerHTML = a.face + '<span class="ch-name">' + a.name + "</span>";
    b.addEventListener("click", function () { pickAnimal(a, b); });
    choicesEl.appendChild(b);
  });
}
function starBurst(container) {
  for (var i = 0; i < 9; i++) {
    var s = document.createElement("span");
    s.className = "star-fx";
    s.textContent = i % 2 ? "✨" : "⭐";
    s.style.left = "50%"; s.style.top = "38%";
    s.style.setProperty("--dx", (Math.random() * 260 - 130) + "px");
    s.style.setProperty("--dy", (Math.random() * -160 - 20) + "px");
    container.appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 900); })(s);
  }
}
function pickAnimal(a, btn) {
  if (animalLock || !curAnimal) return;
  ensureAudio();
  if (a.id === curAnimal.id) {
    animalLock = true;
    if (!qMissed) setScore++;
    dotStates[setQ - 1] = qMissed ? "done" : "perfect";
    refreshDots();
    sceneEl.classList.add("open");
    peekEl.style.opacity = "0";
    revealEl.innerHTML = curAnimal.face;
    revealEl.hidden = false;
    void revealEl.offsetWidth;
    revealEl.classList.add("jump");
    sndCorrect();
    starBurst(sceneEl);
    nextBtn.textContent = setQ >= SET_LEN ? "けっか ▶" : "つぎへ ▶";
    nextBtn.hidden = false;
    animalTimer = setTimeout(function () {
      if (setQ >= SET_LEN) showAnimalResult(); else newAnimalRound();
    }, 3000);
  } else {
    qMissed = true;
    sndPoyon();
    btn.classList.remove("shake");
    void btn.offsetWidth;
    btn.classList.add("shake");
  }
}
bushWrapEl.addEventListener("click", function () {
  if (animalLock || !curAnimal) return;
  ensureAudio();
  sceneEl.classList.remove("rustle");
  void sceneEl.offsetWidth;
  sceneEl.classList.add("rustle");
  sndRustle();
  setTimeout(function () { sndAnimal(curAnimal.id); }, 240);
});
nextBtn.addEventListener("click", function () {
  sndTap();
  if (setQ >= SET_LEN) { clearTimeout(animalTimer); showAnimalResult(); }
  else newAnimalRound();
});
document.querySelector('[data-goto="animal"]').addEventListener("click", startAnimalSet);
startAnimalSet();

var swipeAcc = 0, swipeLast = null;
function rustleBurst() {
  if (!curAnimal) return;
  ensureAudio();
  sceneEl.classList.remove("rustle-big");
  void sceneEl.offsetWidth;
  sceneEl.classList.add("rustle-big");
  sndRustle();
  setTimeout(function () { if (curAnimal) sndAnimal(curAnimal.id); }, 200);
  var chars = aMode === "vehicle" ? ["✨", "✨", "⭐"] : ["🍃", "🍃", "✨"];
  for (var i = 0; i < 6; i++) {
    var s = document.createElement("span");
    s.className = "leaf-fx";
    s.textContent = chars[i % chars.length];
    s.style.left = (18 + Math.random() * 60) + "%";
    s.style.top = (46 + Math.random() * 26) + "%";
    s.style.setProperty("--dx", (Math.random() * 130 - 65) + "px");
    s.style.setProperty("--dy", (Math.random() * -70 - 25) + "px");
    sceneEl.appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 900); })(s);
  }
}
sceneEl.addEventListener("pointerdown", function (e) { swipeLast = { x: e.clientX, y: e.clientY }; swipeAcc = 0; });
sceneEl.addEventListener("pointermove", function (e) {
  if (!swipeLast || animalLock || !curAnimal) return;
  var dx = e.clientX - swipeLast.x, dy = e.clientY - swipeLast.y;
  swipeAcc += Math.sqrt(dx * dx + dy * dy);
  swipeLast = { x: e.clientX, y: e.clientY };
  if (swipeAcc > 75) { swipeAcc = 0; rustleBurst(); }
});
["pointerup", "pointercancel"].forEach(function (ev) { sceneEl.addEventListener(ev, function () { swipeLast = null; }); });

var animalFxCanvas = document.getElementById("animalFx");
var afx = { run: false, parts: [], rockets: [], launched: 0, total: 0, last: 0 };
var AFX_HUES = ["#ff5252", "#ffd740", "#40c4ff", "#ff80ab", "#b2ff59", "#ff9f43", "#c39bff"];
function startAnimalFireworks(n) {
  var view = document.getElementById("view-animal");
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  animalFxCanvas.width = Math.max(2, Math.round(view.clientWidth * dpr));
  animalFxCanvas.height = Math.max(2, Math.round(view.clientHeight * dpr));
  afx.run = true; afx.parts = []; afx.rockets = []; afx.launched = 0;
  afx.total = Math.max(1, n); afx.last = 0;
  requestAnimationFrame(afxLoop);
}
function stopAnimalFireworks() {
  afx.run = false;
  var x = animalFxCanvas.getContext("2d");
  if (x) x.clearRect(0, 0, animalFxCanvas.width, animalFxCanvas.height);
}
function afxBurst(cx, cy, color, scale) {
  for (var i = 0; i < 30; i++) {
    var a = Math.random() * Math.PI * 2, sp = (Math.random() * 4.6 + 1.2) * scale;
    afx.parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, size: (Math.random() * 3 + 1.6) * scale, color: color });
  }
  noiseHit(0, 0.5, 380, 0.5); tone(105, 0, 0.5, "sine", 0.35, 42);
}
function afxLoop(ts) {
  if (!afx.run) return;
  var x = animalFxCanvas.getContext("2d");
  var w = animalFxCanvas.width, h = animalFxCanvas.height;
  var scale = w / Math.max(1, document.getElementById("view-animal").clientWidth);
  x.clearRect(0, 0, w, h);
  if (afx.launched < afx.total && ts - afx.last > 470) {
    afx.last = ts; afx.launched++;
    afx.rockets.push({ x: w * (0.14 + Math.random() * 0.72), y: h + 8, ty: h * (0.14 + Math.random() * 0.24), vy: -(9 + Math.random() * 3) * scale, color: AFX_HUES[afx.launched % AFX_HUES.length] });
    tone(520, 0, 0.3, "sine", 0.12, 1500);
  }
  afx.rockets = afx.rockets.filter(function (r) {
    r.y += r.vy;
    x.fillStyle = "#fff7cc";
    x.beginPath(); x.arc(r.x, r.y, 3.4 * scale, 0, 6.29); x.fill();
    if (r.y <= r.ty) { afxBurst(r.x, r.y, r.color, scale); return false; }
    return true;
  });
  afx.parts = afx.parts.filter(function (p) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.045 * scale; p.life -= 0.012;
    if (p.life <= 0) return false;
    x.globalAlpha = Math.max(0, p.life);
    x.fillStyle = p.color;
    x.beginPath(); x.arc(p.x, p.y, p.size, 0, 6.29); x.fill();
    x.globalAlpha = 1;
    return true;
  });
  if (afx.launched >= afx.total && !afx.rockets.length && !afx.parts.length) { afx.run = false; x.clearRect(0, 0, w, h); return; }
  requestAnimationFrame(afxLoop);
}

function drawStampShape(ctx, x, y, size, color, shape) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  var s = size;
  if (shape === "star") {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var r = i % 2 === 0 ? s : s * 0.45;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      var px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  } else if (shape === "heart") {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.85);
    ctx.bezierCurveTo(-s * 1.25, -s * 0.1, -s * 0.62, -s * 1.05, 0, -s * 0.38);
    ctx.bezierCurveTo(s * 0.62, -s * 1.05, s * 1.25, -s * 0.1, 0, s * 0.85);
    ctx.fill();
  } else if (shape === "shinkansen") {
    ctx.beginPath();
    ctx.moveTo(-s * 1.7, s * 0.5);
    ctx.lineTo(-s * 1.55, -s * 0.45);
    ctx.quadraticCurveTo(-s * 0.4, -s * 0.72, s * 0.7, -s * 0.55);
    ctx.quadraticCurveTo(s * 1.6, -s * 0.42, s * 1.75, s * 0.1);
    ctx.quadraticCurveTo(s * 1.78, s * 0.5, s * 1.2, s * 0.55);
    ctx.lineTo(-s * 1.7, s * 0.55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#173a5e";
    [-1.05, -0.45, 0.15, 0.75].forEach(function (fx) { ctx.fillRect(fx * s - s * 0.16, -s * 0.38, s * 0.32, s * 0.34); });
  } else if (shape === "panda") {
    ctx.beginPath(); ctx.arc(-s * 0.78, -s * 0.72, s * 0.34, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.78, -s * 0.72, s * 0.34, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, s, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#263238";
    ctx.beginPath(); ctx.ellipse(-s * 0.36, -s * 0.08, s * 0.17, s * 0.24, -0.3, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.36, -s * 0.08, s * 0.17, s * 0.24, 0.3, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, s * 0.3, s * 0.14, s * 0.1, 0, 0, 6.29); ctx.fill();
  } else if (shape === "dino") {
    ctx.beginPath();
    ctx.moveTo(-s * 1.5, s * 0.35);
    ctx.lineTo(-s * 0.7, -s * 0.25);
    ctx.lineTo(s * 0.1, -s * 0.5);
    ctx.lineTo(s * 0.75, -s * 0.95);
    ctx.lineTo(s * 1.45, -s * 0.8);
    ctx.lineTo(s * 1.5, -s * 0.35);
    ctx.lineTo(s * 0.85, -s * 0.2);
    ctx.lineTo(s * 0.7, s * 0.15);
    ctx.lineTo(s * 0.95, s * 0.8);
    ctx.lineTo(s * 0.55, s * 0.85);
    ctx.lineTo(s * 0.3, s * 0.35);
    ctx.lineTo(-s * 0.3, s * 0.5);
    ctx.lineTo(-s * 0.15, s * 0.85);
    ctx.lineTo(-s * 0.55, s * 0.85);
    ctx.lineTo(-s * 0.85, s * 0.5);
    ctx.closePath(); ctx.fill();
  } else if (shape === "patcar") {
    var bx = -s * 1.55, by = -s * 0.05, bw = s * 3.1, bh = s * 0.72, br = s * 0.22;
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.lineTo(bx + bw - br, by); ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + br);
    ctx.lineTo(bx + bw, by + bh - br); ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - br, by + bh);
    ctx.lineTo(bx + br, by + bh); ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - br);
    ctx.lineTo(bx, by + br); ctx.quadraticCurveTo(bx, by, bx + br, by);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-s * 0.75, -s * 0.05); ctx.lineTo(-s * 0.45, -s * 0.62); ctx.lineTo(s * 0.55, -s * 0.62); ctx.lineTo(s * 0.85, -s * 0.05);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#173a5e";
    ctx.fillRect(-s * 0.42, -s * 0.55, s * 0.34, s * 0.4);
    ctx.fillRect(-s * 0.02, -s * 0.55, s * 0.5, s * 0.4);
    ctx.fillStyle = "#ff5252"; ctx.fillRect(-s * 0.28, -s * 0.84, s * 0.28, s * 0.18);
    ctx.fillStyle = "#42a5f5"; ctx.fillRect(s * 0.02, -s * 0.84, s * 0.28, s * 0.18);
    ctx.fillStyle = "#263238";
    ctx.beginPath(); ctx.arc(-s * 0.95, s * 0.72, s * 0.3, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.95, s * 0.72, s * 0.3, 0, 6.29); ctx.fill();
  } else {
    for (var k = 0; k < 5; k++) {
      var a2 = -Math.PI / 2 + k * (Math.PI * 2 / 5);
      ctx.beginPath();
      ctx.arc(Math.cos(a2) * s * 0.52, Math.sin(a2) * s * 0.52, s * 0.44, 0, 6.29);
      ctx.fill();
    }
    ctx.fillStyle = "#fff59d";
    ctx.beginPath(); ctx.arc(0, 0, s * 0.34, 0, 6.29); ctx.fill();
  }
  ctx.restore();
}
function spawnSparkles(x, y, color, n) {

  }
}
function stampAt(x, y) {
  var fav = curStamp === "shinkansen" || curStamp === "panda" || curStamp === "dino" || curStamp === "patcar";
  drawStampShape(artX, x, y, fav ? 24 : 15, curColor, curStamp);
  stampCount++;
  spawnSparkles(x, y, curColor, 3);
  var now = performance.now();
  if (now - lastSoundAt > 115) { lastSoundAt = now; sndPenta(); }
}
function ptrPos(e) {
  var r = fxC.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
fxC.addEventListener("pointerdown", function (e) {
  stampPopEl.hidden = true;
  if (launchPhase) return;
  ensureAudio();
  drawingNow = true;
  try { fxC.setPointerCapture(e.pointerId); } catch (err) {}
  var p = ptrPos(e);
  lastPt = p;
  stampAt(p.x, p.y);
  e.preventDefault();
});
fxC.addEventListener("pointermove", function (e) {
  if (!drawingNow || launchPhase) return;
  var p = ptrPos(e);
  var dx = p.x - lastPt.x, dy = p.y - lastPt.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist >= 21) {
    var steps = Math.floor(dist / 21);
    for (var i = 1; i <= steps; i++) stampAt(lastPt.x + dx * i / steps, lastPt.y + dy * i / steps);
    lastPt = p;
  }
  e.preventDefault();
});
["pointerup", "pointercancel"].forEach(function (ev) {
  fxC.addEventListener(ev, function () { drawingNow = false; });
});
document.getElementById("trashBtn").addEventListener("click", function () {
  if (launchPhase) return;

  launchPhase = "rise";

function spawnBurst(cx, cy, n, spdMul) {
  var hues = ["#ff5252", "#ffd740", "#40c4ff", "#ff80ab", "#b2ff59", "#ff9f43", "#c39bff"];
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = (Math.random() * 5.2 + 1.2) * spdMul;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.008 + Math.random() * 0.012, size: Math.random() * 3 + 1.4, color: hues[i % hues.length], grav: 0.035 });
  }
}
function sndMiniBoom() { noiseHit(0, 0.5, 320, 0.5); tone(105, 0, 0.5, "sine", 0.4, 40); }
/* ---------- 変身花火（形に浮かび上がる特殊花火） ---------- */
function ringPts(cx, cy, r, n) {
  var a = [];
  for (var i = 0; i < n; i++) { var t = i / n * Math.PI * 2; a.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]); }
  return a;
}
var SHAPES = {
  panda: { color: "#ffffff", pts: ringPts(0, 0, 0.95, 14).concat(ringPts(-0.75, -0.75, 0.3, 4), ringPts(0.75, -0.75, 0.3, 4), [[-0.35, -0.08], [0.35, -0.08], [0, 0.3]]) },
  shinkansen: { color: "#82b1ff", pts: [[-1, -0.1], [-0.6, -0.38], [0, -0.45], [0.55, -0.4], [0.92, -0.15], [1, 0.15], [0.6, 0.3], [-0.2, 0.35], [-0.8, 0.3], [-1, 0.1], [-0.55, -0.05], [-0.15, -0.05], [0.25, -0.05], [0.6, -0.02]] },
  dino: { color: "#b2ff59", pts: [[-1, 0.2], [-0.6, -0.15], [-0.1, -0.35], [0.4, -0.55], [0.75, -0.85], [1, -0.65], [0.95, -0.3], [0.6, -0.2], [0.5, 0.1], [0.65, 0.55], [0.4, 0.6], [0.25, 0.25], [-0.1, 0.4], [-0.05, 0.65], [-0.3, 0.65], [-0.5, 0.4], [-0.8, 0.45]] },
  patcar: { color: "#ff8a80", pts: [[-1, 0.25], [-1, -0.1], [-0.5, -0.15], [-0.35, -0.5], [0.3, -0.5], [0.5, -0.15], [1, -0.1], [1, 0.25], [0.62, 0.25], [0.62, 0.5], [0.35, 0.5], [0.35, 0.25], [-0.35, 0.25], [-0.35, 0.5], [-0.62, 0.5], [-0.62, 0.25]] }
};
function spawnShapeBurst(cx, cy, key, R) {
  var sh = SHAPES[key];
  sh.pts.forEach(function (pt) {
    particles.push({ shape: true, sx: cx, sy: cy, x: cx, y: cy, tx: cx + pt[0] * R, ty: cy + pt[1] * R, born: performance.now(), travel: 420, life: 1, decay: 0.007, size: 3.2, color: sh.color, grav: 0, vx: 0, vy: 0 });
  });
}
function fxLoop(ts) {
  requestAnimationFrame(fxLoop);
  if (views.draw.hidden) return;
  var w = stageEl.clientWidth, h = stageEl.clientHeight;
  if (!w) return;
  fxX.clearRect(0, 0, w, h);
  /* 星空 */
  skyStars.forEach(function (st) {
    var tw = 0.45 + 0.4 * Math.sin(ts / 700 + st.p);
    fxX.globalAlpha = tw;
    fxX.fillStyle = "#ffffff";
    fxX.beginPath(); fxX.arc(st.x, st.y, st.r, 0, 6.29); fxX.fill();
  });
  fxX.globalAlpha = 1;
  /* 打ち上げ演出 */
  if (launchPhase === "rise") {
    var p = Math.min(1, (ts - launchStart) / 900);
    var cx = w / 2, cy = h * 0.36;
    var iw = w * (1 - p * 0.88), ih = h * (1 - p * 0.88);
    var iy = h - ih - (h - ih - (cy - ih / 2)) * p;
    fxX.save();
    fxX.globalAlpha = 1 - p * 0.25;
    if (stampCount > 0) fxX.drawImage(artC, cx - iw / 2, iy, iw, ih);
    fxX.restore();
    fxX.fillStyle = "#ffe082";
    fxX.shadowColor = "#ffd54f"; fxX.shadowBlur = 22;
    fxX.beginPath(); fxX.arc(cx, iy + ih / 2, 7 + p * 5, 0, 6.29); fxX.fill();
    fxX.shadowBlur = 0;
    spawnSparkles(cx + (Math.random() - 0.5) * 16, iy + ih / 2 + 12, "#ffd54f", 2);
    if (p >= 1) {
      sndBoom();
      var burstCount = launchPower <= 0 ? 1 : Math.min(4, 1 + Math.floor(launchPower / 12));
      var pN = 80 + Math.min(110, launchPower * 2);
      var pSpd = 1 + Math.min(0.9, launchPower / 55);
      spawnBurst(cx, cy, pN, pSpd);
      var offs = [
        { dx: -0.20, dy: -0.05, delay: 210 }, { dx: 0.20, dy: -0.02, delay: 400 }, { dx: 0, dy: -0.15, delay: 590 }
      ];
      for (var bi = 1; bi < burstCount; bi++) {
        var o = offs[(bi - 1) % offs.length];
        pendingBursts.push({ at: ts + o.delay, x: cx + w * o.dx, y: cy + h * o.dy, n: Math.round(pN * 0.8), spd: pSpd });
      }
      if (launchPower >= 30 || Math.random() < 0.55) {
        var shapeKeys = Object.keys(SHAPES);
        pendingBursts.push({ at: ts + 430, x: cx, y: cy - h * 0.03, shape: shapeKeys[Math.floor(Math.random() * shapeKeys.length)], R: 85 + Math.min(55, launchPower) });
      }
      artX.clearRect(0, 0, w, h);
      stampCount = 0;
      launchPhase = "burst";
      burstStart = ts;
    }
  } else if (launchPhase === "burst" && ts - burstStart > 2600) {
    launchPhase = "";
  }
  if (pendingBursts.length) {
    var remain = [];
    pendingBursts.forEach(function (b) {
      if (ts >= b.at) {
        if (b.shape) spawnShapeBurst(b.x, b.y, b.shape, b.R);
        else spawnBurst(b.x, b.y, b.n, b.spd);
        sndMiniBoom();
      }
      else remain.push(b);
    });
    pendingBursts = remain;
  }
  /* パーティクル */
  particles = particles.filter(function (pt) { return pt.life > 0; });
  particles.forEach(function (pt) {
    if (pt.shape) {
      var age = performance.now() - pt.born;
      var pr = Math.min(1, age / pt.travel);
      var e2 = 1 - Math.pow(1 - pr, 3);
      pt.x = pt.sx + (pt.tx - pt.sx) * e2;
      pt.y = pt.sy + (pt.ty - pt.sy) * e2;
      if (pr >= 1) pt.life -= pt.decay;
      fxX.globalAlpha = Math.max(0, Math.min(1, pt.life)) * (0.75 + 0.25 * Math.sin(age / 90));
      fxX.fillStyle = pt.color;
      fxX.shadowColor = pt.color; fxX.shadowBlur = 10;
      fxX.beginPath(); fxX.arc(pt.x, pt.y, pt.size, 0, 6.29); fxX.fill();
      fxX.shadowBlur = 0;
      return;
    }
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.grav; pt.life -= pt.decay;
    fxX.globalAlpha = Math.max(0, pt.life);
    fxX.fillStyle = pt.color;
    fxX.beginPath(); fxX.arc(pt.x, pt.y, pt.size, 0, 6.29); fxX.fill();
  });
  fxX.globalAlpha = 1;
}
requestAnimationFrame(fxLoop);
</script>
